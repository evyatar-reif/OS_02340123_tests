name: Test the runner
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and Linux process/PTY integration tests
        run: python3 test_suite.py self-test
      - name: Validate starter case discovery
        run: python3 test_suite.py list
